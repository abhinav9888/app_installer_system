services:
  - type: web
    name: vertx-app
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_HOST
        value: your-database-host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: your-db-user
      - key: DB_PASSWORD
        value: your-db-password
      - key: DB_NAME
        value: your-db-name
